[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-inspired-cultural-align"
version = "0.1.0"
description = "Code release for human-inspired data-light cultural alignment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Cultural Alignment Research Team" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "hdbscan>=0.8.33",
  "torch>=2.0",
  "tqdm>=4.66",
  "loguru>=0.7",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "pyproj>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]
