experiment: ind_demo
dataset_config: code/configs/datasets/ind_demo.yaml
output_dir: code/artifacts/demo_ind
seed: 42
training:
  epochs: 3
  batch_size: 64
  eval_batch_size: 128
  device: cpu
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.05
  k_neg: 8
  acc_coef: 1.0
  bc_coef: 0.1
  itd_coef: 0.1
evaluation:
  metrics:
    - rmse
    - mae
    - rbf_mmd
    - r2
