experiment: demo_transfer_from_cn_us_metatype
dataset_config: code/configs/datasets/ind_demo.yaml
source_checkpoint: code/pretrained/metatypes/cn_us_source_metatype/best_model.pt
output_dir: results/demo_ind_transfer_from_cn_us_metatype
seed: 20260515
training:
  target_fraction: 1.0
  calibrate_epochs: 1
  finetune_epochs: 2
  batch_size: 64
  eval_batch_size: 128
  device: cpu
  lr: 0.001
  weight_decay: 0.0001
  k_neg: 8
  acc_coef: 1.0
  bc_coef: 0.1
  itd_coef: 0.1
evaluation:
  metrics:
    - rmse
    - mae
    - rbf_mmd
    - r2
